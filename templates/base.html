<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>


<header class="site-header">

    <a
        href="/"
        class="brand"
    >
        FitBuddy
    </a>


    <nav>

        <a href="/">
            Create Plan
        </a>

        <a
            href="/docs"
            target="_blank"
        >
            API Docs
        </a>

    </nav>

</header>


<main class="page">

    {% block content %}
    {% endblock %}

</main>


<footer>

    FitBuddy · General wellness support,
    not medical advice.

</footer>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>


</body>

</html>
